# admuffs example configuration.
# Copy to ~/.config/admuffs/admuffs.conf, or run `admuffs --setup` to generate it.

# --- TV identity (must match a brand/model in the IR database) ---
tv_brand=samsung
tv_model=generic

# Control: auto (API then IR) | api | ir
method=auto
tv_ip=192.168.1.50

# Per-brand API credentials (filled by the setup wizard's pairing step) ---
samsung_token=
lg_client_key=
sony_psk=
vizio_auth_token=

# --- Infrared ---
# backend: irsend (LIRC) | ir-ctl (kernel rc-core) | dryrun (log only)
ir_backend=irsend
ir_device=/dev/lirc0
# LIRC remote name; blank uses the database default for the brand
ir_remote=

# --- Audio capture for loudness + ACR detection ---
# audio_tap: where the input listens -- 'room' (mic hears the TV speakers;
# the default; see 'mute paradox' in the README) or 'upstream' (line-out/
# HDMI extractor/optical: detection keeps working while the TV is muted,
# at the cost of extra wiring).
# mute_mode: 'mute' (silent ads), 'volume_drop' (drop volume drop_steps during ads;
# with a room mic, detection keeps hearing and restore timing stays exact),
# or 'normalize' (continuously level volume toward norm_target_db).
# max_mute_s: failsafe -- never stay muted/dropped longer than this (0 = off).
# 'auto' scans for a capture-capable card (your USB mic) -- recommended on
# Raspberry Pi, where the onboard 'default' device is playback-only.
# Or set a specific device from 'arecord -l', e.g. plughw:1,0.
# Blank disables audio-based detection.
audio_device=auto
audio_tap=room
mute_mode=volume_drop
drop_steps=6
max_mute_s=240
# volume normalization (mute_mode=normalize): target is set from the web
# remote's FIX VOLUME TARGET button; 0 = unset
norm_target_db=0
norm_tolerance_db=3.0
norm_interval_ms=2000
norm_max_range=12
audio_rate=16000
loudness_delta_db=4.0

# --- Detection tuning ---
mute_debounce_ms=1500
unmute_debounce_ms=2500
fire_threshold=0.6

# Loudness calibration (normally written by the web remote's Sample buttons;
# when both *_n counts are > 0, loudness_delta_db is derived from these)
cal_normal_db=0
cal_normal_n=0
cal_commercial_db=0
cal_commercial_n=0

# --- ACR ad recognition (implemented; needs an ACRCloud project with an
# ads bucket -- see README "Setting up ACR") ---
# acr_provider=acrcloud enables it; leave blank to disable.
acr_provider=
acr_host=
acr_key=
acr_secret=
acr_interval_s=20
acr_sample_seconds=8

# --- External metadata feed (still a stub) ---
metadata_provider=
metadata_url=
metadata_key=

# --- Web remote ---
# Browser remote served during --run at http://<pi>:8995/ (Power, D-pad,
# digits, volume/channel, mute, input). 0 disables. LAN-only trust model:
# no auth -- do not expose this port beyond your home network.
web_port=8995

# --- Misc ---
# Blank = auto-search: ./data/ir_codes, /usr/local/share/admuffs/ir_codes,
# /usr/share/admuffs/ir_codes. Set only to use a custom location.
ir_db_dir=
log_file=
log_level=1

# Web-remote PIN (default 0000). Stored as a salted hash, generated on
# first run -- do NOT set these by hand; change the PIN in the web UI.
# pin_salt=
# pin_hash=
